services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spendova
      POSTGRES_USER: spendova
      POSTGRES_PASSWORD: spendova_dev
    volumes:
      - spendova_db:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendova"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local mail catcher: the backend sends real SMTP here; read it at http://127.0.0.1:8026.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025" # web inbox
      - "${MAILPIT_SMTP_PORT:-1026}:1025" # SMTP

  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://spendova:spendova_dev@db:5432/spendova
      EMAIL_DELIVERY_MODE: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"
      EMAIL_FROM: Spendova <no-reply@spendova.local>
    depends_on:
      db: {condition: service_healthy}
      mailpit: {condition: service_started}

volumes:
  spendova_db:
