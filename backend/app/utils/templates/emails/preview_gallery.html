<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spendova email studio</title>
<style>*{box-sizing:border-box}body{margin:0;background:{{ theme.background }};color:{{ theme.ink }};font-family:'Segoe UI',Arial,sans-serif}header{padding:24px 32px;background:#fff;border-bottom:1px solid {{ theme.border }}}h1{margin:0 0 6px;font-size:24px;letter-spacing:-.5px}header strong{color:{{ theme.primary }}}header p{margin:0;color:{{ theme.muted }};font-size:13px}main{display:grid;grid-template-columns:240px 1fr;max-width:1120px;margin:auto}nav{padding:24px 16px}section{padding:24px 0}iframe{width:100%;height:1000px;border:0;border-radius:20px;background:#fff}small{display:block;padding:12px 14px;color:{{ theme.muted }};line-height:1.6}.preview-pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:5px 0}.preview-pair span{grid-column:1/-1;font-size:12px;font-weight:600;padding:4px 14px}.preview-pair a{padding:6px 14px;border-radius:8px;color:{{ theme.muted }};text-decoration:none;font-size:12px}.preview-pair a:hover,.preview-pair a:focus{background:{{ theme.soft }};color:{{ theme.primary }}}@media(max-width:650px){main{display:block}nav{display:flex;overflow:auto;padding:12px}.preview-pair{min-width:170px}section{padding:0}header{padding:18px}}@media(prefers-color-scheme:dark){body{background:{{ dark.background }};color:{{ dark.ink }}}header{background:{{ dark.card }};border-color:{{ dark.border }}}header strong{color:{{ dark.accent }}}header p,small,.preview-pair a{color:{{ dark.muted }}}.preview-pair a:hover,.preview-pair a:focus{background:{{ dark.soft }};color:{{ dark.accent }}}}</style></head>
<body><header><h1><strong>Spendova</strong> / Email studio</h1><p>Light and dark previews with fictional data.</p></header><main><nav>{{ links | safe }}<small>Templates: app/utils/templates/emails/<br>Assets: app/static/email/<br>Regenerate: python scripts/preview_emails.py</small></nav><section><iframe name="email-preview" src="verify-email.html" title="Email preview"></iframe></section></main></body></html>
